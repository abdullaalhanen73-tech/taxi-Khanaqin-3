name: Build Debug APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - run: npm install @capacitor/core @capacitor/android
      - run: npm install -D @capacitor/cli

      - name: Create capacitor.config.ts
        run: |
          cat > capacitor.config.ts << 'EOF'
          import type { CapacitorConfig } from '@capacitor/cli';

          const config: CapacitorConfig = {
            appId: 'com.taxikhanaqin.app',
            appName: 'تكسي خانقين',
            webDir: 'dist',
            server: {
              androidScheme: 'https',
            },
          };

          export default config;
          EOF

      - run: npm run build

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - run: npx cap add android
      - name: Prepare icon resource
        run: |
          mkdir -p resources
          cp icon.png resources/icon.png

      - name: Generate app icons
        run: |
          npm install -D @capacitor/assets
          npx capacitor-assets generate --android --iconBackgroundColor '#FFCD2D' --iconBackgroundColorDark '#FFCD2D'
      - name: Fix Kotlin stdlib duplicate classes
        run: |
          cat >> android/build.gradle << 'EOF'

          allprojects {
              configurations.all {
                  resolutionStrategy {
                      force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
                      exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
                      exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
                  }
              }
          }
          EOF
      - run: npx cap sync android

      - name: Build APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
